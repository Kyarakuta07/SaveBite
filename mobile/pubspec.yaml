name: savebite
description: "SaveBite - Selamatkan Makanan, Hemat Pengeluaran"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management (skill: riverpod-state.md)
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Navigation (skill: gorouter-navigation.md)
  go_router: ^14.0.0

  # Networking
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0

  # UI / UX
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.0

  # Utilities
  intl: ^0.20.2
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.0
  shared_preferences: ^2.2.0

  # Location & Media
  geolocator: ^12.0.0
  google_maps_flutter: ^2.9.0
  geocoding: ^3.0.0
  image_picker: ^1.0.7
  url_launcher: ^6.3.2

  # Firebase (FCM push notifications)
  firebase_core: ^3.14.0
  firebase_messaging: ^15.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.8.0
  freezed: ^2.5.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
